name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory TestResults
      - name: Start Kafka for integration tests
        run: |
          Authentication__ApiKey=ci-placeholder-key Authentication__AdminApiKey=ci-placeholder-admin-key docker compose -f docker-compose.yml -f compose.local.yaml up -d --wait kafka
      - name: Test publication and record deletion against Kafka
        env:
          KAFKA_INTEGRATION_BOOTSTRAP_SERVERS: localhost:19092
        run: dotnet test -c Release --no-build --filter Category=KafkaIntegration
      - run: docker build -t kafka-ingestion-api:ci .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: TestResults
