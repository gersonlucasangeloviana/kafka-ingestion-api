services:
  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__ApiKey: ${Authentication__ApiKey:?Set an API key}
      Authentication__AdminApiKey: ${Authentication__AdminApiKey:?Set a separate admin key}
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: ${Kafka__Topic:-benchmark.ids}
      Kafka__EnablePurge: ${Kafka__EnablePurge:-false}
      Kafka__Partitions: ${Kafka__Partitions:-6}
      Ingestion__MaxConcurrentRequests: ${Ingestion__MaxConcurrentRequests:-8192}
    expose:
      - "8080"
    networks:
      - default
      - dokploy-network
    labels:
      # Dokploy v0.29.11 injects domain labels only into list-form labels.
      - "traefik.docker.network=dokploy-network"
    stop_grace_period: 30s

volumes:
  kafka-data:

networks:
  default:
  dokploy-network:
    external: true
    name: dokploy-network
